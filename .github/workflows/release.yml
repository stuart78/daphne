name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Each platform builds on its own runner. Cross-compiling Electron from one
    # host is possible but fragile — Windows installers want wine, Linux
    # AppImages want their own tooling — and the failures surface late.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Pinned, not latest. electron-builder 25 signs by making its own
          # temporary keychain, and on the macOS 26 image that keychain refuses
          # its own password: every build fails at set-key-partition-list with
          # "the passphrase you entered is not correct", before Apple is ever
          # contacted. The same secrets signed fine on the older image.
          - os: macos-15
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    runs-on: ${{ matrix.os }}
    name: ${{ matrix.name }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Generated rather than committed, so it has to exist before packaging.
      - run: pnpm icon

      - name: Build and publish
        run: pnpm --filter @oramics/shell run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

          # macOS signing. electron-builder imports the certificate from
          # CSC_LINK into a temporary keychain itself, so there is no keychain
          # handling to do here.
          CSC_LINK: ${{ secrets.APPLE_CERT_P12 }}
          CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}

          # Notarising. All three are needed; electron-builder.config.js skips
          # the notary step if any are missing rather than failing the build.
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

          # Without a certificate secret this is 'false', which builds unsigned
          # rather than erroring. So a fork with no credentials still releases.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.APPLE_CERT_P12 != '' }}

      # Notarising is a round trip to Apple and can take a few minutes. Worth
      # confirming rather than assuming, since an unnotarised build looks
      # identical until someone else opens it.
      # Matched on the name, not the image: the runner is pinned, so a check
      # written against macos-latest quietly stopped running.
      - name: Check the macOS build is signed and stapled
        if: matrix.name == 'macOS'
        run: |
          APP="packages/shell/release/mac-arm64/Daphne.app"
          [ -d "$APP" ] || APP="packages/shell/release/mac/Daphne.app"
          echo "== codesign =="
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E "Authority|TeamIdentifier|flags" || true
          echo "== gatekeeper =="
          spctl -a -vvv -t install "$APP" 2>&1 || echo "not accepted (expected if unsigned or not notarised)"
          echo "== staple =="
          xcrun stapler validate "$APP" 2>&1 || echo "no notarisation ticket stapled"

      - name: Keep the artifacts even if publishing failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daphne-${{ matrix.name }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            packages/shell/release/*.dmg
            packages/shell/release/*.zip
            packages/shell/release/*.exe
            packages/shell/release/*.AppImage
            packages/shell/release/*.tar.gz
